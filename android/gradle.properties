org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Disable daemon to prevent stale process reuse
org.gradle.daemon=false
# Single worker to prevent concurrent CMake processes locking files on Windows
org.gradle.workers.max=1
# Disable CMake ninja metadata timing files (AGP 8.x Windows file lock workaround)
android.native.buildOutput=verbose
android.experimental.androidTest.numShards=1
